[project]
name = "deepagentcourse"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "vikas kesharvani", email = "vikashkesharvani62@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "deepagents>=0.7.24",
    "ipykernel>=7.4.0",
    "langchain>=1.4.5",
    "langchain-community>=0.4.2",
    "langchain-groq>=1.1.3",
    "langchain-openai>=1.7.1",
    "python-dotenv>=1.2.4",
    "tavily-python>=0.8.5",
]

[project.scripts]
deepagentcourse = "deepagentcourse:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"
